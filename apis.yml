name: Atlas5D
description: Atlas5D is a healthcare technology company that develops an Ambient Measurement System (AMS)
  for assessing health and wellness through motion in any environment. Its passive, privacy-preserving sensor
  platform recognizes specific individuals, characterizes and quantifies their movement, and interprets daily
  routines to predict trends and assess risk of adverse events such as falls, without wearables, without
  transmitting video, and without storing images. Atlas5D serves individuals monitoring aging loved ones,
  assisted-living and other institutional care settings, and healthcare and clinical-trial teams that need
  clinical-grade, real-world evidence of patient movement wherever people live. Backed by Techstars.
